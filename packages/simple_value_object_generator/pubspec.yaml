name: simple_value_object_generator
description: >
  A Dart code generator that simplifies the creation of Value Objects using Dart's extension type.
version: 1.0.1
homepage: https://github.com/r-koubou/dart_simple_barrel_generator
repository: https://github.com/r-koubou/dart_simple_barrel_generator

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: '^3.5.0'

resolution: workspace

dependencies:
  simple_value_object_annotation: ^1.0.0
  build: ^4.0.3
  source_gen: ^4.1.1
  analyzer: ^9.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build_runner: ^2.10.4
